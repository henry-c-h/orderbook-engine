[project]
name = "orderbook-engine"
version = "0.1.0"
description = "Deterministic limit order book matching engine"
readme = "README.md"
authors = [
  { name = "henryc", email = "66845831+henry-c-h@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "sortedcontainers>=2.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
orderbook-engine = "orderbook_engine.adapters.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "hypothesis>=6.168.0",
  "pre-commit>=4.6.2",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.6",
  "sortedcontainers-stubs>=2.4.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
